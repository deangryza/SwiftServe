flutter_launcher_icons:
  # Use: dart run tool/generate_app_icons.dart (preserves Xcode build settings).
  android: true
  ios: true
  min_sdk_android: 21
  image_path: assets/app_icon/swiftserve_icon.png
  adaptive_icon_background: "#FFD539"
  adaptive_icon_foreground: assets/app_icon/swiftserve_foreground.png
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#FFD539"
