<svg xmlns="http://www.w3.org/2000/svg" width="350" height="168" viewBox="0 0 350 168" role="img" aria-labelledby="title description">
  <title id="title">SwiftServe Plus promotion</title>
  <desc id="description">Book first and pay less with SwiftServe Plus for 99 pesos per month.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF6"/>
      <stop offset="1" stop-color="#FFF0C2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#404040"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
  </defs>

  <rect x="0.75" y="0.75" width="348.5" height="166.5" rx="27.25" fill="url(#background)" stroke="#E8DFC8" stroke-width="1.5"/>

  <rect x="20" y="17" width="115" height="23" rx="11.5" fill="#252525"/>
  <text x="77.5" y="33.5" text-anchor="middle" fill="#FFCC33" font-family="Arial, sans-serif" font-size="12" font-weight="700">SwiftServe Plus</text>

  <text x="20" y="70" fill="#252525" font-family="Arial, sans-serif" font-size="21" font-weight="800">Book first, pay</text>
  <text x="20" y="95" fill="#252525" font-family="Arial, sans-serif" font-size="21" font-weight="800">less</text>

  <g id="try-plus-button" role="button" aria-label="Try Plus for 99 pesos per month">
    <rect x="20" y="114" width="142" height="40" rx="14" fill="#FFCC33"/>
    <text x="91" y="139.5" text-anchor="middle" fill="#252525" font-family="Arial, sans-serif" font-size="13" font-weight="700">Try Plus · &#8369;99/mo</text>
  </g>

  <g id="plus-card" transform="translate(198 38) rotate(8 70 44)">
    <rect width="140" height="88" rx="16" fill="url(#card)"/>
    <rect y="22" width="140" height="14" fill="#FFCC33"/>
    <text x="18" y="70" fill="#FFCC33" font-family="Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="3">PLUS</text>
    <path d="M121 50 112 63h6l-2 11 10-14h-6z" fill="#FFCC33"/>
  </g>

  <path d="M326 23.5 329 30l6.5 3-6.5 3-3 6.5-3-6.5-6.5-3 6.5-3z" fill="#FFCC33" stroke="#252525" stroke-width="2" stroke-linejoin="round"/>
</svg>
